<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>
<style>
    body{
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 50px;
        flex-direction: column;
    }
    .LOGIN-CONTAINER{
        background: antiquewhite;
        border-radius: 15px;
        padding: 40PX;
        width: 250PX;
        box-shadow: 0 0 20PX;

    }
    .input-box{
        margin-bottom: 15px;
    }

    label{
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
    }
    .option{
        text-align: right;
        margin-bottom: 15px;
        color:pink ;
    }
    button[type="submit"]{
        width: 50%;
        padding: 3px;
        border-radius: 5px;
        cursor: pointer;

    }
    .signup{
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        
    }
    .link{
        justify-items: center;
        align-items: center;
        flex-direction: column;
        padding: 5px;
        gap: 10px;
    }
    
    a{
        color: pink;
    }
    .BB{
        justify-content: center;
        
    }

</style>
<body>
    <DIV class="LOGIN-CONTAINER">
        <CEnter><H2>LOGIN</H2></CEnter>
        
        <div class="input-box">
            <LABEL for="Email">Email</LABEL>
            <input type="email" placeholder="Enter your email">
            </div>
        <div class="input-box">
            <label for="password">Password</label>
            <input type="password" placeholder="Enter your password">
        </div>    

        <div class="option">
            <a href="forget password">forget password</a>
        </div>
        <button type="submit">Lorgin</button>
        

    </DIV>
    <div class="link">
        <p>OR</p>
        
        <P class="AA"><a href="">continue with goggle</a></P>
        <p class="BB"><a href="">continue with apple</a></P>
        <p class="signup">Don't have an account? <a href="sign up">sign up</a></p>
    </div>
        
    
    
</body>
</html>
